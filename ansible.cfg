[defaults]
# Roolien hakemisto – suhteessa projektin juureen, ei playbook-kansioon
roles_path = roles

# Inventory-default jotta -i inventory/hosts.yml ei ole pakollinen
inventory = inventory/hosts.yml

# Ei host key -tarkistusta (Azure VM:t saavat uuden avaimen joka deploylla)
host_key_checking = False

# Vault-salasanaa EI kovakoodata tähän: ansible.cfg on committoitu, ja polku olisi
# konekohtainen (forkkaajilta puuttuisi .vault_pass → ajot hajoaisivat).
# Valitse paikallisesti jompikumpi:
#   export ANSIBLE_VAULT_PASSWORD_FILE=.vault_pass   # luo .vault_pass (gitignored)
#   tai lisää --ask-vault-pass komentoihin
# Jaa vault-salasana tiimin kesken erikseen – EI koskaan repoon.
