---
# ── Repojen siivous ───────────────────────────────────────────────────────────
# TÄMÄN LOHKON ON OLTAVA ENNEN MITÄÄN dnf-TASKIA, myös ennen "Update packages".
#
# dnf lataa kaikkien KÄYTÖSSÄ olevien repojen metadatan ennen mitä tahansa
# operaatiota – myös ennen paketin poistoa. Yksikin tavoittamaton repo kaataa
# siis koko deployn, riippumatta siitä tarvitaanko repoa mihinkään. Siksi
# kaikki korjaukset tehdään puhtaina tiedosto-operaatioina (file, ini_file),
# eikä yhtään dnf-kutsua saa olla ennen kuin repot ovat kunnossa.
#
# Kaksi tavoittamatonta repoa:
#
#   packages.microsoft.com – NSG-sääntö DenyInternetOut estää pääsyn julkiseen
#   internetiin. Rajoitus on tarkoituksellinen ja honeypotin tärkein
#   turvakontrolli, joten repo poistetaan sen sijaan että se avattaisiin.
#   Seuraus: Sysmon ei ole asennettavissa (monitoring_enabled: false).
#
#   codeready-builder – RHEL 10.2:lle ei ole julkaistu RHUI-sisältöä. Kyse ei
#   ole verkosta: muut repot tulevat samalta palvelimelta ja toimivat.
#   Kehityspakettien repo, jota honeypot ei tarvitse.

- name: Poista tavoittamattomat Microsoft-repotiedostot
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/yum.repos.d/microsoft-prod.repo
    - /etc/yum.repos.d/packages-microsoft-com-prod.repo
    - /etc/yum.repos.d/prod.repo
  when: not monitoring_enabled

- name: Tarkista käytöstä poistettavien repojen tiedostot
  stat:
    path: "{{ item.file }}"
  loop: "{{ dnf_disabled_repos }}"
  loop_control:
    label: "{{ item.repo }}"
  register: disabled_repo_files

- name: Poista tavoittamattomat repot käytöstä
  community.general.ini_file:
    path: "{{ item.item.file }}"
    section: "{{ item.item.repo }}"
    option: enabled
    value: "0"
    no_extra_spaces: true
    mode: '0644'
  loop: "{{ disabled_repo_files.results }}"
  loop_control:
    label: "{{ item.item.repo }}"
  when: item.stat.exists

# ── Tästä eteenpäin dnf on turvallista ────────────────────────────────────────

- name: Poista Microsoftin repo-paketti kun Sysmon ei ole käytössä
  dnf:
    name: packages-microsoft-prod
    state: absent
  when: not monitoring_enabled

- name: Update packages
  dnf:
    name: "*"
    state: latest
    update_cache: true
  when: package_management_enabled

- name: Install basic packages
  dnf:
    name:
      - firewalld       # RHEL:llä ufw:n sijasta
      - audit           # RHEL: paketti = "audit", palvelu = "auditd"
      - audispd-plugins # Välittää audit-lokit syslogiin → AMA kerää DCR:n kautta
      # fail2ban poistettu tarkoituksella: honeypotilla ei blokata hyökkääjiä –
      # enemmän yrityksiä = enemmän dataa Sentineliin
      - curl
      - wget
      - git
      - python3-pip
      - unzip
      - jq
      - net-tools
      - tcpdump
      - rsyslog
      - postgresql-server
      - python3-psycopg2
    state: present
  when: package_management_enabled

- name: Set hostname
  hostname:
    name: "{{ lure_hostname }}"

- name: Update /etc/hosts
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ lure_hostname }}"

# ── Firewalld ─────────────────────────────────────────────────────────────────
# RHEL käyttää firewalld:tä ufw:n sijaan.
# Drop-zone hylkää kaiken liikenteen oletuksena – sallitaan vain erikseen.

- name: Start and enable firewalld
  service:
    name: firewalld
    state: started
    enabled: true

- name: Firewalld – aseta drop oletuszoneksi (deny all inbound)
  command: firewall-cmd --set-default-zone=drop
  register: zone_result
  changed_when: "'already set' not in zone_result.stdout"

- name: Firewalld – salli honeypot-portit sisään
  firewalld:
    zone: drop
    port: "{{ item.port }}/{{ item.proto }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ honeypot_open_ports }}"

# Outbound-suodatus: salli vain Sentinel (443), pakettirepot (80/443), DNS (53)
# Kaikki muu ulospäin suuntautuva liikenne blokataan.
#
# Toteutettu firewalld policy objectina, EI iptables-moduulilla. Syyt:
#   1) iptables-moduulin säännöt elävät vain ajonaikaisessa taulussa – ilman
#      iptables-services-pakettia ne katosivat rebootissa ja outbound-lukitus
#      lakkasi hiljaisesti olemasta voimassa
#   2) raaka "OUTPUT policy DROP" katkaisi myös loopback-liikenteen, koska
#      lo-liitännälle ei ollut ACCEPT-sääntöä – mm. psql -h 127.0.0.1 hajosi
#   3) firewalld ja suorat iptables-säännöt kilpailevat samoista nftables-
#      tauluista RHEL 9:stä eteenpäin (RHEL 10 on nftables-only)
# Policy object persistoituu itsestään ja hoitaa conntrackin.

- name: Firewalld – varmista policies-hakemisto
  file:
    path: /etc/firewalld/policies
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Firewalld – outbound-policy (vain sallittu liikenne ulos)
  template:
    src: egress-policy.xml.j2
    dest: /etc/firewalld/policies/egress.xml
    owner: root
    group: root
    mode: '0644'
  notify: Reload firewalld

# ── SSH ───────────────────────────────────────────────────────────────────────
# Portti pysyy 22:ssa – pääsynhallinta hoidetaan Azure NSG:llä.

- name: Remove root SSH login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
  notify: Restart SSH

# ── Auditd ────────────────────────────────────────────────────────────────────

- name: Configure auditd to monitor critical files
  template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/honeypot.rules
    mode: '0640'
  notify: Reload audit rules

- name: Etsi audisp syslog-pluginin polku
  stat:
    path: "{{ item }}"
  loop:
    - /etc/audit/plugins.d/syslog.conf   # RHEL 8+
    - /etc/audisp/plugins.d/syslog.conf  # RHEL 7 / vanhemmat
  register: audisp_paths

- name: Enable audisp-syslog plugin (audit-lokit → syslog → AMA)
  lineinfile:
    path: "{{ item.item }}"
    regexp: '^active'
    line: 'active = yes'
  loop: "{{ audisp_paths.results }}"
  when: item.stat.exists
  notify: Reload auditd plugins

# Ohjaa auditd omaan syslog-facilityynsä (oletus local6). Ilman tätä audit-
# tapahtumat menevät LOG_USER-facilityyn ja sekoittuvat kaikkeen muuhun
# logger-liikenteeseen.
#
# Syy on kustannushallinta, ei siisteys: auditd on ylivoimaisesti suurin
# volyymin lähde (execve + connect jokaisesta prosessista). Omassa
# facilityssään sitä voi säätää tai pudottaa DCR:stä koskematta authpriv-
# kirjautumisiin tai cron-persistenssiin, jotka ovat halpoja ja arvokkaita.
#
# audisp-syslog args = <prioriteetti> <facility>
- name: Aseta audisp-syslogin prioriteetti ja facility
  lineinfile:
    path: "{{ item.item }}"
    regexp: '^args'
    line: "args = {{ audit_syslog_priority }} {{ audit_syslog_facility }}"
  loop: "{{ audisp_paths.results }}"
  when: item.stat.exists
  notify: Reload auditd plugins

## AMA-HUOMIO:
## Azure Monitor Agent asennetaan automaattisesti kun DCR liitetään VM:ään.
## Syslog-keräys konfiguroidaan DCR:ssä – kerättävät facilityt on lueteltu
## README:n lokiketju-osiossa. Auditd tulee tästä roolista facilityyn joka on
## määritelty muuttujassa audit_syslog_facility (ks. defaults/main.yml).
## Lokiketju: auditd → audisp-syslog → syslog → AMA → Log Analytics → Sentinel

- name: Set timezone to UTC
  timezone:
    name: UTC
