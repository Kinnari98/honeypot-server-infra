- name: Bring Microsoft packages repository GPG key to the system
  rpm_key:
    state: present
    key: https://packages.microsoft.com/keys/microsoft.asc

- name: Install microsoft packages repository
  dnf:
    name: "https://packages.microsoft.com/config/rhel/{{ ansible_distribution_major_version }}/packages-microsoft-prod.rpm"
    state: present

- name: Install sysmonforlinux
  dnf:
    name: sysmonforlinux
    state: present

- name: Install sysmon-config.xml to /etc/sysmon/sysmon-config.xml.j2
  template:
    src: sysmon-config.xml.j2
    dest: /etc/sysmon/sysmon-config.xml
    owner: root
    group: root
    mode: '0644'

- name: Check if sysmon service is registered
  ansible.builtin.command: systemctl list-unit-files sysmon.service
  register: sysmon_svc
  changed_when: false
  failed_when: false

- name: Install sysmon (first time only)
  ansible.builtin.command: sysmon -accepteula -i /etc/sysmon/config.xml
  when: "'sysmon.service' not in sysmon_svc.stdout"



