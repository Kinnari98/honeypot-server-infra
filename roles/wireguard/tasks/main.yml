## tasks/*.yml


- name: Ensure private key (example task)
  copy:
    src: wg0.key
    dest: /etc/wireguard/wg0.key
    owner: root
    group: root
    mode: '0600'
  notify:
    - restart wireguard

- name: Create Wireguard directory
  file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Enable WireGuard service
  service:
    name: wg-quick@wg0
    enabled: true

- name: Start WireGuard
  service:
    name: wg-quick@wg0
    state: started

- name: Deploy WireGuard configuration
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  notify:
    - restart wireguard