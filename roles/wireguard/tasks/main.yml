---
- name: Install WireGuard
  dnf:
    name: wireguard-tools
    state: present

- name: Create Wireguard directory
  file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy WireGuard configuration
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  notify:
    - restart wireguard

- name: Enable and start WireGuard
  service:
    name: wg-quick@wg0
    enabled: true
    state: started