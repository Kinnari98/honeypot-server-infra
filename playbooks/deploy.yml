---
## playbooks/deploy.yml
## Pääplaybookki – ajaa kaikki roolit honeypot-palvelimelle järjestyksessä.
##
## Käyttö:
##   ansible-playbook playbooks/deploy.yml
##
## Konfiguraatio tulee inventorysta (group_vars/all/ + host_vars/), ei
## ympäristömuuttujista. Vault-salasana tarvitaan – ks. README kohta 2b.
##
## Kehityksessä auditd-sääntöjä iteroidessa:
##   ansible-playbook playbooks/deploy.yml -e audit_immutable=false

- name: Deploy honeypot server
  hosts: machines
  become: true         # sudo-oikeudet palvelimella

  roles:
    ## Vaihe 1: Pohjakovennukset, auditd, firewalld, SSH-hardening
    ## Dokumentaatio: roles/common/tasks/main.yml
    - role: common
      tags: [common, base]
    - role: high-interaction
      tags: [high-interaction, motd]
    - role: users
      tags: [users, accounts]
    - role: psql
      tags: [psql, database]
    - role: crontab
      tags: [crontab, backup]
    - role: monitoring
      tags: [monitoring, sysmon]
